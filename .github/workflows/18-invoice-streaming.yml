name: 18-invoice-streaming

on:
  push:
    branches: [main]
    paths: ["18-invoice-streaming/**", ".github/workflows/18-invoice-streaming.yml"]
  pull_request:
    paths: ["18-invoice-streaming/**", ".github/workflows/18-invoice-streaming.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 18-invoice-streaming
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 18-invoice-streaming/requirements.txt

      - run: pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests (no Kafka, Spark or MongoDB needed)
        run: pytest -q

      - name: Compose file is valid
        run: docker compose config --quiet
