name: lab04-kafka

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: lab04-kafka
    environment:
      # Single node acting as both broker and KRaft controller (no ZooKeeper since Kafka 4.0)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # single broker => replication factor 1 everywhere
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    ports:
      - "127.0.0.1:29092:29092" # for clients on the host: localhost:29092
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40
    mem_limit: 768m

  app:
    build: .
    image: data-engineering-lab/04-kafka:local
    container_name: lab04-app
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    working_dir: /lab/app
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/lab
    command: sleep infinity
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 256m

  kafka-ui:
    profiles: ["ui"] # optional: make up-ui (adds ~400 MB)
    image: kafbat/kafka-ui:v1.5.0
    container_name: lab04-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m
