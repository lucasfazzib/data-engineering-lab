models:
  - name: stg_olist__orders
    description: Orders with typed lifecycle timestamps.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_id
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ["created", "approved", "invoiced", "processing", "shipped", "delivered", "canceled", "unavailable"]
      - name: purchased_at
        data_tests: [not_null]

  - name: stg_olist__customers
    description: One row per customer_id (i.e. per order). Use customer_unique_id to identify a person.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
      - name: zip_code_prefix
        description: First 5 digits of the CEP, left-padded with zeros.

  - name: stg_olist__order_items
    description: One row per order line.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_number]
    columns:
      - name: price
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: freight_value
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__sellers')
                field: seller_id

  - name: stg_olist__order_payments
    description: One row per payment of an order.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_sequential]
    columns:
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["credit_card", "boleto", "voucher", "debit_card", "not_defined"]

  - name: stg_olist__order_reviews
    description: Raw reviews. NOT unique by review_id nor by order_id — deduplicated in int_order_reviews__latest.
    columns:
      - name: review_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5

  - name: stg_olist__products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_olist__sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_olist__geolocation
    description: Many rows per zip_code_prefix — aggregated in int_geolocation__zip_centroids.

  - name: stg_olist__category_translation
    columns:
      - name: category_name
        data_tests: [unique, not_null]
