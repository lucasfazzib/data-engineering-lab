# DuckDB is a local file with no credentials, so the profile can live in the repo.
# For a cloud warehouse this file stays in ~/.dbt/ and reads secrets from env vars.
olist:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../warehouse/olist.duckdb') }}"
      threads: 4
