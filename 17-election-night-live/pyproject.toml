[project]
name = "election-night-live"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR2004", "PLR0913", "PLR0915"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
