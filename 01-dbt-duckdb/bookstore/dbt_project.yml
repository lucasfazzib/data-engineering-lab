name: bookstore
version: "1.0.0"
profile: bookstore

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

# Folder-level defaults. A model can override any of these with {{ config(...) }}.
models:
  bookstore:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

seeds:
  bookstore:
    +schema: seeds
