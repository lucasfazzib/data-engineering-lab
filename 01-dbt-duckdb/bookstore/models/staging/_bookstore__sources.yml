sources:
  - name: bookstore
    description: Raw tables landed by the ingestion layer (scripts/load_landing.py). All columns arrive as VARCHAR.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: { count: 12, period: hour }
        error_after: { count: 24, period: hour }
    tables:
      - name: customers
        description: Full extract of the customers table — replaced on every load.
        columns:
          - name: customer_id
            data_tests:
              - not_null
      - name: books
        description: Full extract of the book catalog — replaced on every load.
      - name: orders
        description: >
          Append-only. A status change arrives as a NEW row for the same order_id with a newer updated_at,
          so the same order can appear multiple times.
      - name: order_items
        description: Append-only order lines.
